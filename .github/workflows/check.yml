name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The rules every game keeps
        run: npm run check
      - name: Tests (every game plays through the local server)
        run: npm test
      - name: Balance (bots play every game)
        run: npm run sim
